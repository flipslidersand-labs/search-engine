name: pip-audit

on:
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 03:00 UTC。失敗した schedule run が検知の通知になる
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit requirements.lock.txt
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock.txt --strict --no-deps --disable-pip
