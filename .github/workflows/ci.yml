name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-test:
    permissions:
      contents: read
      pull-requests: write
    # ref: main (SHA 固定。更新は renovate/dependabot に任せる)
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@ea9ddf743bd492a13ceb4aa7c1c54cc33e49f72d
    with:
      python-version: "3.12"
      coverage-threshold: 80
      install-command: "pip install -r requirements.lock.txt pytest pytest-cov --quiet"
      test-path: "tests/"
      # 未指定だと runner ごとに既存 ruff の版が違い結果が揺れる(YUKI だけ UP017 で落ちた)
      ruff-version: "0.15.18"
